<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laudo Radiográfico Veterinário</title>

<style>

body{
    margin:0;
    background:#dde5ec;
    font-family: Arial, Helvetica, sans-serif;
    color:#1f2a37;
}

/* ===== PÁGINA A4 ===== */
.page{
    width:210mm;
    min-height:297mm;
    margin:10px auto;
    background:white;
    padding:14mm;
    box-sizing:border-box;
    box-shadow:0 3px 18px rgba(0,0,0,0.08);
    page-break-after:always;

    display:flex;
    flex-direction:column;
    gap:10px;
}

/* ===== CABEÇALHO ===== */
.header{
    border-bottom:1px solid #e5e7eb;
    padding-bottom:6px;
}

.header h1{
    margin:0;
    font-size:18px;
    font-weight:600;
}

.subtitle{
    font-size:12px;
    color:#6b7280;
}

/* ===== DADOS ===== */
.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    font-size:12px;
}

input,select,textarea{
    width:100%;
    font-size:12px;
    padding:6px;
    border:1px solid #ddd;
    border-radius:6px;
    box-sizing:border-box;
}

/* ===== IMAGENS ===== */
.image-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
}

.image-grid img{
    width:100%;
    height:85px;
    object-fit:cover;
    border-radius:6px;
    border:1px solid #eee;
}

/* ===== ODONTOGRAMA ===== */
.tooth{
    width:34px;
    height:34px;
    border:1px solid #bbb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    border-radius:6px;
    cursor:pointer;
}

.tooth.selected{background:#2e7d32;color:white;}
.tooth.alert{background:#e53935;color:white;}
.tooth.extracted{background:#757575;color:white;}

.row{
    display:flex;
    gap:6px;
    align-items:center;
    margin-bottom:4px;
}

.row-title{
    width:120px;
    font-size:11px;
    font-weight:600;
}

/* ===== LAUDO ===== */
#laudo{
    border:1px solid #e5e7eb;
    padding:10px;
    border-radius:8px;
    background:#fafafa;
    font-size:13px;
    line-height:1.3;
    white-space:pre-line;
    min-height:300px;
}

/* ===== TÍTULOS ===== */
.section-title{
    font-size:12px;
    font-weight:700;
    letter-spacing:.4px;
    color:#374151;
    margin-top:6px;
}

/* ===== PRINT ===== */
@media print{
    body{background:white;}
    .page{box-shadow:none;margin:0;}
    button{display:none;}
}

/* ===== BOTÕES ===== */
button{
    padding:8px 12px;
    border:none;
    background:#1565c0;
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
}

</style>
</head>

<body>

<!-- ================= PAGE 1 ================= -->
<div class="page">

<div class="header">
<h1>Laudo Radiográfico Odontológico Veterinário</h1>
<div class="subtitle">Radiologia Veterinária</div>
</div>

<div class="grid">
<input placeholder="Paciente">
<input placeholder="Tutor">
<input placeholder="Espécie">
<input placeholder="Raça">
<input placeholder="Idade">
<input placeholder="Peso">
</div>

<div class="section-title">Imagens radiográficas</div>
<div class="image-grid" id="imgGrid1"></div>

<div class="section-title">Odontograma</div>
<div id="odontograma"></div>

</div>

<!-- ================= PAGE 2 ================= -->
<div class="page">

<div class="section-title">Imagens adicionais</div>
<div class="image-grid" id="imgGrid2"></div>

</div>

<!-- ================= PAGE 3 ================= -->
<div class="page">

<div class="section-title">Laudo radiográfico</div>
<div id="laudo" contenteditable="true"></div>

<div class="section-title">Assinatura</div>
<input placeholder="Nome do Médico Veterinário">
<input placeholder="CRMV">

<br>

<button onclick="montarLaudo()">Atualizar Laudo</button>
<button onclick="window.print()">Imprimir / PDF</button>

</div>

<script>

let alteracoes = [];

/* ===== ODONTOGRAMA ===== */
function adicionarAlteracao(dente,tipo){
    alteracoes.push({dente,tipo});
    montarLaudo();
}

function agrupar(){
    let g = {};
    alteracoes.forEach(a=>{
        if(!g[a.tipo]) g[a.tipo]=[];
        if(!g[a.tipo].includes(a.dente))
            g[a.tipo].push(a.dente);
    });
    return g;
}

/* ===== LAUDO ===== */
function montarLaudo(){

let grupos = agrupar();

let elementos = "Elementos dentários sem alterações significativas.";
let ligamento = "Lâmina dura preservada.";
let osso = "Osso alveolar sem alterações.";
let furca = "Sem evidência de comprometimento de furca.";
let impressao = "Sem alterações radiográficas relevantes.";

if(grupos.periodontal){
let d = grupos.periodontal.join(", ");
ligamento = `Alterações periodontais nos elementos ${d}.`;
osso = `Perda óssea associada aos elementos ${d}.`;
impressao = `Doença periodontal nos elementos ${d}.`;
}

if(grupos.furca){
let d = grupos.furca.join(", ");
furca = `Comprometimento de furca nos elementos ${d}.`;
impressao = `Envolvimento de furca nos elementos ${d}.`;
}

if(grupos.lesao_coroa){
let d = grupos.lesao_coroa.join(", ");
elementos = `Reabsorção coronária nos elementos ${d}.`;
impressao = `Lesão de reabsorção dentária nos elementos ${d}.`;
}

document.getElementById("laudo").innerText = `
ELEMENTOS DENTÁRIOS
${elementos}

LIGAMENTO PERIODONTAL
${ligamento}

OSSO ALVEOLAR
${osso}

REGIÃO DE FURCA
${furca}

IMPRESSÃO DIAGNÓSTICA
${impressao}
`;

}

/* ===== ODONTOGRAMA ===== */
function renderTeeth(){

let container = document.getElementById("odontograma");
container.innerHTML = "";

for(let i=101;i<=108;i++){

let t = document.createElement("div");
t.className="tooth";
t.innerText=i;

t.onclick=()=>{
adicionarAlteracao(i,"periodontal");
t.classList.add("selected");
};

container.appendChild(t);
}

}

/* ===== INIT ===== */
renderTeeth();
montarLaudo();

</script>

</body>
</html>
